name: Quality Checks

# Runs the full quality pipeline (lint, security, unit tests, UI tests)
# on every push and pull request. Mirrors the local `make ci` flow so
# results are reproducible locally and in CI.
on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit pytest-playwright

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Lint (Ruff)
        run: make lint

      - name: Security scan (Bandit)
        run: make security

      - name: Unit tests + coverage (pytest)
        run: make test

      - name: UI tests (Playwright)
        run: make ui-test

      - name: Show artifacts
        run: make reports

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: reports/
          if-no-files-found: error